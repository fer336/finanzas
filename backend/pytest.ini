[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=70
    -p no:warnings
    --asyncio-mode=auto

markers =
    security: Security-related tests (authentication, authorization, injection)
    performance: Performance and load tests
    integration: Integration tests
    unit: Unit tests
    slow: Slow running tests
    database: Tests that require database connection
    minio: Tests that require MinIO connection
    ai: Tests for AI agent functionality
