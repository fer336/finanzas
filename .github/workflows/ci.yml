# ====================================================================
# 🔍 CI - Lint, Build y Chequeos en cada Pull Request
#
# Corre en cada push/PR contra main para detectar errores antes de que
# lleguen a producción. También se expone como workflow reusable
# (workflow_call) para que deploy.yml lo invoque como gate: el deploy
# solo continúa si este CI pasó.
#
# NOTA: el backend hoy no tiene suite de tests (no hay carpeta tests/).
# Cuando se agregue, sumar un step de pytest en el job `backend`.
# ====================================================================
name: 🔍 CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 🐍 Backend (import + deps)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: 📦 Instalar dependencias
        run: pip install -r requirements.txt

      - name: ✅ Verificar que la app importa sin errores
        run: python -c "import main"

      # TODO: cuando exista suite de tests, reemplazar el step anterior por:
      # - name: 🧪 Tests
      #   run: pytest --cov=app --cov-report=xml

  frontend:
    name: 🎨 Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🔍 Lint
        run: npm run lint

      - name: 🏗️ Build
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ci-dummy-value
          VITE_BACKEND_URL: http://localhost:8000

  docker-build:
    name: 🐳 Verificar que las imágenes buildean
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐍 Build imagen backend (sin push)
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🎨 Build imagen frontend (sin push)
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
