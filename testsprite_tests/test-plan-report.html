<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan de Pruebas - Sistema de Gastos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 30px;
            background: #f8f9fa;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .stat-card h3 {
            color: #667eea;
            font-size: 2em;
            margin-bottom: 5px;
        }
        
        .stat-card p {
            color: #666;
            font-size: 0.9em;
        }
        
        .content {
            padding: 40px;
        }
        
        .test-case {
            background: #fff;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            margin-bottom: 25px;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .test-case:hover {
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.15);
            border-color: #667eea;
        }
        
        .test-header {
            padding: 20px;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .test-header:hover {
            background: linear-gradient(135deg, #e9ecef 0%, #dee2e6 100%);
        }
        
        .test-title {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .test-id {
            background: #667eea;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85em;
        }
        
        .test-name {
            font-size: 1.1em;
            font-weight: 600;
            color: #2d3748;
        }
        
        .test-badges {
            display: flex;
            gap: 10px;
        }
        
        .badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75em;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .badge.high {
            background: #fee;
            color: #c53030;
        }
        
        .badge.medium {
            background: #fef5e7;
            color: #d97706;
        }
        
        .badge.functional {
            background: #e6f3ff;
            color: #1e40af;
        }
        
        .badge.performance {
            background: #f0fdf4;
            color: #15803d;
        }
        
        .badge.security {
            background: #fef3c7;
            color: #92400e;
        }
        
        .badge.ui {
            background: #f3e8ff;
            color: #6b21a8;
        }
        
        .badge.error {
            background: #fecaca;
            color: #991b1b;
        }
        
        .test-body {
            padding: 25px;
            display: none;
        }
        
        .test-body.active {
            display: block;
            animation: slideDown 0.3s ease;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .description {
            padding: 15px;
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        
        .steps {
            margin-top: 20px;
        }
        
        .step {
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            gap: 15px;
            align-items: start;
        }
        
        .step.action {
            background: #e6f3ff;
            border-left: 4px solid #3b82f6;
        }
        
        .step.assertion {
            background: #f0fdf4;
            border-left: 4px solid #10b981;
        }
        
        .step-icon {
            font-size: 1.5em;
            line-height: 1;
        }
        
        .step-content {
            flex: 1;
        }
        
        .step-type {
            font-weight: 600;
            font-size: 0.85em;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        
        .step.action .step-type {
            color: #1e40af;
        }
        
        .step.assertion .step-type {
            color: #15803d;
        }
        
        .footer {
            background: #2d3748;
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .toggle-icon {
            transition: transform 0.3s ease;
        }
        
        .toggle-icon.active {
            transform: rotate(180deg);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧪 Plan de Pruebas</h1>
            <p>Sistema de Gastos Inteligente</p>
        </div>
        
        <div class="stats">
            <div class="stat-card">
                <h3>14</h3>
                <p>Casos de Prueba</p>
            </div>
            <div class="stat-card">
                <h3>9</h3>
                <p>Prioridad Alta</p>
            </div>
            <div class="stat-card">
                <h3>5</h3>
                <p>Prioridad Media</p>
            </div>
            <div class="stat-card">
                <h3>~80</h3>
                <p>Pasos Totales</p>
            </div>
        </div>
        
        <div class="content">
            <div id="test-cases"></div>
        </div>
        
        <div class="footer">
            <p>Generado con TestSprite MCP • Sistema de Gastos v1.0</p>
            <p style="margin-top: 10px; opacity: 0.7;">Click en cualquier caso de prueba para ver los detalles</p>
        </div>
    </div>
    
    <script>
        const testCases = [
  {
    "id": "TC001",
    "title": "Dashboard Load Performance",
    "description": "Verify that the dashboard loads in less than 3 seconds with updated and accurate data displayed in all widgets.",
    "category": "performance",
    "priority": "High",
    "steps": [
      {"type": "action", "description": "Log in as a valid user with multiple transactions and categories."},
      {"type": "action", "description": "Navigate to the Mission Control Dashboard."},
      {"type": "assertion", "description": "Check that all dashboard widgets (balance, transactions, categories, savings goals, credit card debt) are displayed."},
      {"type": "assertion", "description": "Measure load time and confirm it is below 3 seconds."},
      {"type": "assertion", "description": "Verify that data values correspond to user's latest transactions and balances."}
    ]
  },
  {
    "id": "TC002",
    "title": "Create Transaction with Multi-Currency Conversion",
    "description": "Test creating a financial transaction in one currency and verify automatic correct conversion and balance update in base currency.",
    "category": "functional",
    "priority": "High",
    "steps": [
      {"type": "action", "description": "Navigate to the create transaction form."},
      {"type": "action", "description": "Input valid transaction data with amount in USD currency."},
      {"type": "action", "description": "Select a category and payment method."},
      {"type": "action", "description": "Submit the transaction form."},
      {"type": "assertion", "description": "Verify transaction is recorded with correct converted amount in ARS (base currency)."},
      {"type": "assertion", "description": "Verify user balance is updated accordingly with multi-currency conversion applied."}
    ]
  },
  {
    "id": "TC003",
    "title": "Transaction Creation Validates Positive Amount",
    "description": "Ensure transaction cannot be created with zero or negative amount values.",
    "category": "error handling",
    "priority": "High",
    "steps": [
      {"type": "action", "description": "Navigate to the new transaction form."},
      {"type": "action", "description": "Input transaction with amount = 0."},
      {"type": "action", "description": "Attempt to submit the transaction."},
      {"type": "assertion", "description": "Check an error message is displayed preventing submission."},
      {"type": "action", "description": "Repeat the test with a negative amount."},
      {"type": "assertion", "description": "Verify transaction creation is blocked with appropriate error."}
    ]
  },
  {
    "id": "TC004",
    "title": "Manage Categories: Create, Edit, Disable, Delete",
    "description": "Verify full CRUD on categories including uniqueness by user, color/icon customization, and impact on associated transactions.",
    "category": "functional",
    "priority": "High",
    "steps": [
      {"type": "action", "description": "Create a new category with unique name, color, and icon."},
      {"type": "assertion", "description": "Confirm category appears in list and is selectable in transaction forms."},
      {"type": "action", "description": "Attempt to create another category with the same name for the same user."},
      {"type": "assertion", "description": "Verify error is returned for duplicate category name."},
      {"type": "action", "description": "Edit existing category's name and visual properties."},
      {"type": "assertion", "description": "Verify edits are persisted and reflected in associated transactions."},
      {"type": "action", "description": "Disable a category."},
      {"type": "assertion", "description": "Check category becomes unavailable for new transactions but existing transactions retain category."},
      {"type": "action", "description": "Delete a category not associated with any transactions."},
      {"type": "assertion", "description": "Confirm category is removed from user category list."}
    ]
  },
  {
    "id": "TC005",
    "title": "Manage Payment Methods Uniqueness and Usage Stats",
    "description": "Test CRUD operations on payment methods ensuring uniqueness per user and correctness of usage statistics.",
    "category": "functional",
    "priority": "Medium",
    "steps": [
      {"type": "action", "description": "Create a new payment method (e.g., debit card) with unique name."},
      {"type": "assertion", "description": "Verify method appears in list and in transaction forms."},
      {"type": "action", "description": "Attempt creating duplicate payment method name."},
      {"type": "assertion", "description": "Assert creation fails with appropriate error."},
      {"type": "action", "description": "Review payment method usage statistics widget."},
      {"type": "assertion", "description": "Ensure stats reflect accurate counts of transactions associated with each payment method."}
    ]
  },
  {
    "id": "TC006",
    "title": "Savings Goals: Creation, Tracking Progress, and Completion",
    "description": "Verify creation of savings goals with visual progress bars, automatic transaction association, state changes on completion.",
    "category": "functional",
    "priority": "High",
    "steps": [
      {"type": "action", "description": "Create a new savings goal with a target amount."},
      {"type": "assertion", "description": "Confirm goal appears in the objectives widget with zero progress initially."},
      {"type": "action", "description": "Create a transaction associated to this savings goal."},
      {"type": "assertion", "description": "Verify progress bar reflects updated amount towards the goal."},
      {"type": "action", "description": "Add transactions until goal target is reached or exceeded."},
      {"type": "assertion", "description": "Check that goal status updates to complete and visual indicators reflect completion."}
    ]
  },
  {
    "id": "TC007",
    "title": "Credit Card Summary Payment and Transaction Creation",
    "description": "Test paying credit card summaries results in creation of corresponding transactions and updates related summaries and payment statuses.",
    "category": "functional",
    "priority": "High",
    "steps": [
      {"type": "action", "description": "Navigate to credit card summaries section."},
      {"type": "action", "description": "Select a summary with outstanding balance."},
      {"type": "action", "description": "Confirm payment."},
      {"type": "assertion", "description": "Verify a payment transaction is created and linked to credit card."},
      {"type": "assertion", "description": "Check the summary status is updated to paid and next payment date is set."}
    ]
  },
  {
    "id": "TC008",
    "title": "Pending Payments Management with Filters",
    "description": "Verify creation, editing, filtering, and display of pending payments including filtering by overdue and upcoming statuses.",
    "category": "functional",
    "priority": "Medium",
    "steps": [
      {"type": "action", "description": "Create multiple pending payments with various due dates and priorities."},
      {"type": "assertion", "description": "Confirm pending payments appear correctly with expected details."},
      {"type": "action", "description": "Apply filter to show only overdue payments."},
      {"type": "assertion", "description": "Validate only overdue payments are visible."},
      {"type": "action", "description": "Apply filter to show payments due soon."},
      {"type": "assertion", "description": "Ensure payments with upcoming due dates are displayed correctly."},
      {"type": "action", "description": "Edit a pending payment's due date and priority."},
      {"type": "assertion", "description": "Verify changes are saved and reflected in UI and filters."}
    ]
  },
  {
    "id": "TC009",
    "title": "Conversational Financial AI Agent Responds and Executes Functions",
    "description": "Test the AI agent for natural language responses and correct function calls for querying balances, creating transactions, and analyses.",
    "category": "functional",
    "priority": "High",
    "steps": [
      {"type": "action", "description": "Open the AI chatbot interface."},
      {"type": "action", "description": "Ask for current balance summary."},
      {"type": "assertion", "description": "Validate AI provides clear, accurate natural language response."},
      {"type": "action", "description": "Request AI to create a new expense transaction."},
      {"type": "assertion", "description": "Check AI executes function call and confirms creation."},
      {"type": "action", "description": "Ask AI for spending analysis by category."},
      {"type": "assertion", "description": "Verify AI returns meaningful analysis text and/or charts."}
    ]
  },
  {
    "id": "TC010",
    "title": "Bulk Upload Transactions CSV with Validation and Preview",
    "description": "Validate CSV upload flow: load file, show preview with validations per row, block corrupt rows, and confirm import.",
    "category": "functional",
    "priority": "High",
    "steps": [
      {"type": "action", "description": "Navigate to bulk transaction upload page."},
      {"type": "action", "description": "Upload a valid CSV file with multiple transactions."},
      {"type": "assertion", "description": "Display preview table with transaction data and validation statuses."},
      {"type": "action", "description": "Upload a CSV with some invalid rows (e.g., missing required fields, invalid amounts)."},
      {"type": "assertion", "description": "Highlight invalid rows with error messages, prevent import."},
      {"type": "action", "description": "Correct invalid rows and confirm import."},
      {"type": "assertion", "description": "Verify only valid rows are imported as transactions and balances update."}
    ]
  },
  {
    "id": "TC011",
    "title": "Multi-Tenancy Data Security Enforcement",
    "description": "Verify that users can only access and modify their own data, enforcing tenant isolation in all queries and operations.",
    "category": "security",
    "priority": "High",
    "steps": [
      {"type": "action", "description": "Log in as User A and access transactions, categories, payment methods."},
      {"type": "assertion", "description": "Confirm only User A's data is visible."},
      {"type": "action", "description": "Try to access User B's data via API direct calls or URL modification."},
      {"type": "assertion", "description": "Verify access is denied with appropriate authorization errors."},
      {"type": "action", "description": "Attempt to create or modify data referencing User B's tenant."},
      {"type": "assertion", "description": "Ensure backend blocks the operation and logs security violation."}
    ]
  },
  {
    "id": "TC012",
    "title": "Budget Limits Per Category with Monthly and Annual Tracking",
    "description": "Test creation and tracking of budgets per category with enforcement of limits and proper tracking on all cycle types.",
    "category": "functional",
    "priority": "Medium",
    "steps": [
      {"type": "action", "description": "Create a monthly budget limit for a spending category."},
      {"type": "assertion", "description": "Confirm budget appears in budget widget with correct limit."},
      {"type": "action", "description": "Add transactions in that category and monitor budget progress."},
      {"type": "assertion", "description": "Verify progress updates accurately and alerts if limit is near or exceeded."},
      {"type": "action", "description": "Create an annual budget and repeat similar testing."},
      {"type": "assertion", "description": "Ensure annual cycle tracks correctly distinct from monthly limits."}
    ]
  },
  {
    "id": "TC013",
    "title": "Real-time Dollar and CEDEAR Quotation Accuracy",
    "description": "Verify that dollar quotations (official, blue, MEP, CCL) and CEDEAR prices update in real-time and graphs refresh accordingly.",
    "category": "functional",
    "priority": "Medium",
    "steps": [
      {"type": "action", "description": "Open the dollar quotation widget."},
      {"type": "assertion", "description": "Confirm all dollar price types are displayed with latest values."},
      {"type": "action", "description": "Open CEDEARs market view."},
      {"type": "assertion", "description": "Validate CEDEAR prices update accurately with charts rendering price history."}
    ]
  },
  {
    "id": "TC014",
    "title": "Responsive Navigation on Mobile Devices",
    "description": "Test bottom navigation and responsive menu on various mobile devices and screen sizes for correct accessibility and usability.",
    "category": "ui",
    "priority": "Medium",
    "steps": [
      {"type": "action", "description": "Access the application from different mobile device emulators (small to large screen sizes)."},
      {"type": "assertion", "description": "Verify bottom navigation menu is visible, functional, and visually consistent."},
      {"type": "action", "description": "Navigate through all major screens using bottom menu."},
      {"type": "assertion", "description": "Check that menus collapse/expand appropriately and no UI element is clipped or overlapped."}
    ]
  }
];
        
        const container = document.getElementById('test-cases');
        
        testCases.forEach(testCase => {
            const div = document.createElement('div');
            div.className = 'test-case';
            
            const categoryClass = testCase.category.toLowerCase().replace(/\s+/g, '-');
            
            div.innerHTML = `
                <div class="test-header" onclick="toggleTest(this)">
                    <div class="test-title">
                        <span class="test-id">${testCase.id}</span>
                        <span class="test-name">${testCase.title}</span>
                    </div>
                    <div class="test-badges">
                        <span class="badge ${categoryClass}">${testCase.category}</span>
                        <span class="badge ${testCase.priority.toLowerCase()}">${testCase.priority}</span>
                        <span class="toggle-icon">▼</span>
                    </div>
                </div>
                <div class="test-body">
                    <div class="description">
                        <strong>Descripción:</strong> ${testCase.description}
                    </div>
                    <div class="steps">
                        <h4 style="margin-bottom: 15px; color: #2d3748;">Pasos (${testCase.steps.length}):</h4>
                        ${testCase.steps.map((step, index) => `
                            <div class="step ${step.type}">
                                <div class="step-icon">${step.type === 'action' ? '▶️' : '✓'}</div>
                                <div class="step-content">
                                    <div class="step-type">${step.type}</div>
                                    <div>${index + 1}. ${step.description}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            
            container.appendChild(div);
        });
        
        function toggleTest(header) {
            const body = header.nextElementSibling;
            const icon = header.querySelector('.toggle-icon');
            
            body.classList.toggle('active');
            icon.classList.toggle('active');
        }
    </script>
</body>
</html>
