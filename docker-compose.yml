version: "3.8"

services:
  # ⚙️ Backend API
  backend:
    image: ghcr.io/fer336/finanzas-backend:v1.0.26
    networks:
      - network_public
      - finanzas-internal
    secrets:
      - source: finanzas_env
        target: /run/secrets/backend.env
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=network_public"
        
        # Router para health check (usado por el workflow de deploy)
        - "traefik.http.routers.finanzas-health.rule=Host(`finanzas.qeva.xyz`) && Path(`/health`)"
        - "traefik.http.routers.finanzas-health.entrypoints=websecure"
        - "traefik.http.routers.finanzas-health.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.finanzas-health.priority=100"

        # Router para documentación OpenAPI (Swagger/Redoc) — para que un
        # agente externo pueda leer el esquema y conectarse
        - "traefik.http.routers.finanzas-docs.rule=Host(`finanzas.qeva.xyz`) && (Path(`/docs`) || Path(`/redoc`) || Path(`/openapi.json`))"
        - "traefik.http.routers.finanzas-docs.entrypoints=websecure"
        - "traefik.http.routers.finanzas-docs.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.finanzas-docs.priority=100"

        # Router para la API principal (v1)
        - "traefik.http.routers.finanzas-api.rule=Host(`finanzas.qeva.xyz`) && PathPrefix(`/api/v1`)"
        - "traefik.http.routers.finanzas-api.entrypoints=websecure"
        - "traefik.http.routers.finanzas-api.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.finanzas-api.priority=100"
        
        # Router para autenticación de Google
        - "traefik.http.routers.finanzas-auth.rule=Host(`finanzas.qeva.xyz`) && PathPrefix(`/auth`)"
        - "traefik.http.routers.finanzas-auth.entrypoints=websecure"
        - "traefik.http.routers.finanzas-auth.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.finanzas-auth.priority=100"
        
        # Router para configuración runtime
        - "traefik.http.routers.finanzas-config.rule=Host(`finanzas.qeva.xyz`) && PathPrefix(`/config`)"
        - "traefik.http.routers.finanzas-config.entrypoints=websecure"
        - "traefik.http.routers.finanzas-config.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.finanzas-config.priority=100"

        # Router para YFinance API (CEDEARs)
        - "traefik.http.routers.finanzas-yfinance.rule=Host(`finanzas.qeva.xyz`) && PathPrefix(`/api/yfinance`)"
        - "traefik.http.routers.finanzas-yfinance.entrypoints=websecure"
        - "traefik.http.routers.finanzas-yfinance.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.finanzas-yfinance.priority=100"
        
        # Router para MinIO/Files API
        - "traefik.http.routers.finanzas-files.rule=Host(`finanzas.qeva.xyz`) && PathPrefix(`/api/files`)"
        - "traefik.http.routers.finanzas-files.entrypoints=websecure"
        - "traefik.http.routers.finanzas-files.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.finanzas-files.priority=100"

        # Service definition
        - "traefik.http.services.finanzas-backend.loadbalancer.server.port=8000"

  # 🎨 Frontend
  frontend:
    image: ghcr.io/fer336/finanzas-frontend:v1.0.26
    networks:
      - network_public
      - finanzas-internal
    depends_on:
      - backend
    secrets:
      - source: finanzas_env
        target: /run/secrets/backend.env
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=network_public"
        # Router principal para la aplicación de React (prioridad baja)
        - "traefik.http.routers.finanzas-frontend.rule=Host(`finanzas.qeva.xyz`)"
        - "traefik.http.routers.finanzas-frontend.entrypoints=websecure"
        - "traefik.http.routers.finanzas-frontend.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.finanzas-frontend.priority=1"
        - "traefik.http.services.finanzas-frontend.loadbalancer.server.port=80"

networks:
  network_public:
    external: true
    name: network_public
  finanzas-internal:
    driver: overlay
    internal: true

secrets:
  finanzas_env:
    external: true
    # Un solo secreto compartido entre backend y frontend