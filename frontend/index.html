    <!-- Script para suprimir errores de ResizeObserver en desarrollo -->
    <script>
      // Suprimir errores de ResizeObserver que son comunes en desarrollo
      window.addEventListener('error', function(e) {
        if (e.message === 'ResizeObserver loop completed with undelivered notifications.' ||
            e.message === 'ResizeObserver loop limit exceeded') {
          e.stopImmediatePropagation();
          return false;
        }
      });
      
      const resizeObserverErr = /^ResizeObserver loop/;
      window.addEventListener('error', (e) => {
        if (resizeObserverErr.test(e.message)) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
    </script>
