# ====================================================================
# 🚀 DEPLOY A PRODUCCIÓN - FINANZAS APP
#   Build → Push a Docker Hub → Portainer Webhook Redeploy
#
# Secrets requeridos en GitHub:
#   DOCKER_USERNAME        - usuario de Docker Hub (ej: ferc33)
#   DOCKER_PASSWORD        - token de Docker Hub
#   GOOGLE_CLIENT_ID       - Client ID de OAuth Google
#   OAUTH_URL              - callback URL de OAuth (ej: https://finanzas.qeva.xyz/auth/google/callback)
#   N8N_WEBHOOK            - webhook de n8n (ej: https://n8nw.qeva.xyz/webhook/finance-agency)
#   DRIVE_OTHERS_FOLDER_ID - Google Drive folder ID para comprobantes sin proveedor
#   PORTAINER_WEBHOOK_URL  - URL del webhook del stack en Portainer
# ====================================================================
name: 🚀 Deploy a Producción

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de versión manual (default: auto vYYYYMMDD-commit)'
        required: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME || 'ferc33' }}

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      # ── 2. Login a Docker Hub ────────────────────────────────────────────
      - name: 🔑 Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ── 3. Setup Docker Buildx ───────────────────────────────────────────
      - name: ⚙️ Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 4. Generar tag ───────────────────────────────────────────────────
      - name: 🏷️ Generar versión tag
        id: tags
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "VERSION=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=v$(date +'%Y%m%d')-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          fi
          echo "🔖 Tag generado: $(echo "$VERSION")"

      # ── 5. Build & Push Backend ──────────────────────────────────────────
      - name: 🐍 Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/finanzas-backend:${{ steps.tags.outputs.VERSION }}
            ${{ env.DOCKER_USERNAME }}/finanzas-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}

      # ── 6. Build & Push Frontend ─────────────────────────────────────────
      - name: 🎨 Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            VITE_BACKEND_URL=
            VITE_OAUTH_PROD_URL=${{ secrets.OAUTH_URL }}
            VITE_N8N_WEBHOOK=${{ secrets.N8N_WEBHOOK }}
            VITE_DRIVE_OTHERS_FOLDER_ID=${{ secrets.DRIVE_OTHERS_FOLDER_ID }}
          tags: |
            ${{ env.DOCKER_USERNAME }}/finanzas-frontend:${{ steps.tags.outputs.VERSION }}
            ${{ env.DOCKER_USERNAME }}/finanzas-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}

      # ── 7. Deploy vía Portainer Webhook ─────────────────────────────────
      - name: 🚀 Trigger Portainer redeploy
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}")

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Portainer redeploy triggered (HTTP $HTTP_STATUS)"
          else
            echo "❌ Portainer webhook falló (HTTP $HTTP_STATUS)"
            exit 1
          fi

      # ── 8. Notificación ──────────────────────────────────────────────────
      - name: ✅ Notificar resultado
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "🎉 Deploy exitoso: ${{ steps.tags.outputs.VERSION }}"
          else
            echo "❌ Deploy falló"
            exit 1
          fi
