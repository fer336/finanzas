# ====================================================================
# 🚀 DEPLOY A PRODUCCIÓN - FINANZAS APP
#   Release (tag) → CI (gate) → Build → Push a GitHub Container Registry
#   (ghcr.io) → Portainer Webhook Redeploy
#
# Se dispara al publicar un Release en GitHub (no en cada push a main):
#   1. git tag vX.Y.Z && git push origin vX.Y.Z
#   2. gh release create vX.Y.Z --generate-notes   (o desde la UI)
#   3. Esto publica el release → dispara este workflow automáticamente
#
# Los jobs `ci` y `codeql` invocan ci.yml y codeql.yml como workflows
# reusables. build-and-deploy depende de ambos vía `needs` — si
# cualquiera falla, el deploy no se ejecuta.
#
# OJO: el job de CodeQL solo falla si el análisis en sí se rompe, no
# por encontrar vulnerabilidades (esas quedan en la pestaña Security,
# no bloquean el deploy).
#
# Secrets requeridos en GitHub (GITHUB_TOKEN es automático, no hace falta cargarlo):
#   GOOGLE_CLIENT_ID       - Client ID de OAuth Google
#   OAUTH_URL              - callback URL de OAuth (ej: https://finanzas.qeva.xyz/auth/google/callback)
#   PORTAINER_WEBHOOK_URL  - URL del webhook del stack en Portainer
#
# n8n y Google Drive quedaron fuera del flujo de comprobantes (todo pasa
# por MinIO) — sus secrets/build-args ya no se usan acá.
# ====================================================================
name: 🚀 Deploy a Producción

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de versión manual (default: auto vYYYYMMDD-commit)'
        required: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  ci:
    name: 🔍 CI (gate)
    uses: ./.github/workflows/ci.yml

  codeql:
    name: 🔐 CodeQL (gate)
    uses: ./.github/workflows/codeql.yml

  build-and-deploy:
    name: Build & Deploy
    needs: [ci, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: write
      packages: write

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      # ── 2. Login a GitHub Container Registry ─────────────────────────────
      - name: 🔑 Login a ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 3. Setup Docker Buildx ───────────────────────────────────────────
      - name: ⚙️ Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ── 4. Generar tag ───────────────────────────────────────────────────
      - name: 🏷️ Generar versión tag
        id: tags
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            echo "VERSION=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "VERSION=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=v$(date +'%Y%m%d')-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          fi
          echo "🔖 Tag generado: $(echo "$VERSION")"

      # ── 5. Build & Push Backend ──────────────────────────────────────────
      - name: 🐍 Build & Push Backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/finanzas-backend:${{ steps.tags.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/finanzas-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}

      # ── 6. Build & Push Frontend ─────────────────────────────────────────
      - name: 🎨 Build & Push Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            VITE_BACKEND_URL=
            VITE_OAUTH_PROD_URL=${{ secrets.OAUTH_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/finanzas-frontend:${{ steps.tags.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/finanzas-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}

      # ── 7. Deploy vía Portainer Webhook ─────────────────────────────────
      - name: 🚀 Trigger Portainer redeploy
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}")

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Portainer redeploy triggered (HTTP $HTTP_STATUS)"
          else
            echo "❌ Portainer webhook falló (HTTP $HTTP_STATUS)"
            exit 1
          fi

      # ── 8. Verificar salud real del deploy ───────────────────────────────
      # El webhook de Portainer solo dispara el redeploy — no confirma que el
      # contenedor haya levantado. Reintenta contra /health y falla el job de
      # verdad si nunca responde 200 (antes esto quedaba en verde aunque el
      # backend quedara en 0/1 réplicas).
      - name: 🩺 Verificar salud del backend
        run: |
          URL="https://finanzas.qeva.xyz/health"
          echo "Verificando salud en: $URL"
          for i in $(seq 1 10); do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 15 "$URL" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Backend saludable. HTTP 200 (intento $i)"
              exit 0
            fi
            echo "Intento $i/10: HTTP $STATUS. Reintento en 15s..."
            sleep 15
          done
          echo "::error::Health check falló tras 10 intentos (último HTTP $STATUS). El backend no levantó. Revisá logs en Portainer."
          exit 1

      # ── 9. Pin docker-compose.yml a la versión ya verificada sana ────────
      # :latest no sirve acá — Swarm no repuebla el digest en un service
      # update sin --force real, así que un redeploy puede quedar corriendo
      # código viejo sin avisar (por eso se pasó a v1.0.3 a mano). En vez de
      # taggear manualmente en cada release, el CI fija el tag exacto acá
      # (igual que el job pin-stack de octopus) recién después de confirmar
      # el health check — así el compose commiteado siempre referencia una
      # versión que se sabe que levantó bien.
      - name: 📌 Pin docker-compose.yml a la versión deployada
        run: |
          VERSION="${{ steps.tags.outputs.VERSION }}"
          sed -i -E "s#(ghcr\.io/${{ env.IMAGE_OWNER }}/finanzas-backend):[^\"[:space:]]+#\1:${VERSION}#" docker-compose.yml
          sed -i -E "s#(ghcr\.io/${{ env.IMAGE_OWNER }}/finanzas-frontend):[^\"[:space:]]+#\1:${VERSION}#" docker-compose.yml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docker-compose.yml
          if git diff --staged --quiet; then
            echo "docker-compose.yml ya está en ${VERSION}, sin cambios."
          else
            git commit -m "chore: pin docker-compose.yml a ${VERSION} [skip ci]"
            git push origin HEAD:main \
              || echo "::warning::No se pudo pushear el pin a main. Actualizá docker-compose.yml a mano con la versión ${VERSION}."
          fi

      # ── 10. Notificación ─────────────────────────────────────────────────
      - name: ✅ Notificar resultado
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "🎉 Deploy exitoso: ${{ steps.tags.outputs.VERSION }}"
          else
            echo "❌ Deploy falló"
            exit 1
          fi
